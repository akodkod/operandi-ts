name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun fmt --check
      - name: Check types
        run: bun check
      - name: Lint
        run: bun run lint
      - name: Test with coverage
        id: tests
        env:
          NO_COLOR: "1"
        run: |
          mkdir -p coverage
          bun run test:coverage 2>&1 | tee coverage/test-output.txt
      - name: Report test coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          {
            echo '## Test coverage'
            echo ''
            echo '```text'
            if grep -q '^File .*| % Funcs' coverage/test-output.txt; then
              sed -n '/^File .*| % Funcs/,$p' coverage/test-output.txt
            else
              echo 'Coverage was not produced. See the test log for details.'
            fi
            echo '```'
            echo ''
            echo 'LCOV and the test log are available in the coverage artifact. Subprocess coverage is not included.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Build
        run: bun run build

  upload-coverage:
    name: Upload coverage to GitHub
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Convert LCOV to Cobertura
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/coverage-tools"
          "$RUNNER_TEMP/coverage-tools/bin/pip" install lcov-cobertura==2.1.1
          "$RUNNER_TEMP/coverage-tools/bin/lcov_cobertura" coverage/lcov.info --base-dir . --output coverage/cobertura.xml
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura.xml
          language: TypeScript
          label: code-coverage/bun
